<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>316</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#ddd;font-family:Arial,Helvetica,sans-serif}main{position:fixed;inset:0;display:grid;place-items:center;background:#000}video{width:100%;height:100%;object-fit:contain;background:#000}#intro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:28px;background:#000}#intro[hidden]{display:none}h1{font-size:36px;font-weight:300;letter-spacing:.22em;margin:0 0 0 .22em}button{background:transparent;border:1px solid #666;color:#ddd;padding:12px 30px;font:12px Arial,sans-serif;letter-spacing:.25em;cursor:pointer}button:hover,button:focus-visible{border-color:#eee;color:#fff}#status{font-size:12px;max-width:80vw;line-height:1.5;margin:0;color:#aaa}main.playing{cursor:none}
</style>
</head>
<body>
<main id="stage">
<video id="film" playsinline preload="metadata" aria-label="316 audiovisual film" src="https://pub-72e9e2f20fd24867ab095d7021d419db.r2.dev/316_video/316_WEB.mp4"></video>
<section id="intro"><h1>316</h1><button id="play" type="button">PLAY</button><p id="status" role="status" hidden></p></section>
</main>
<script>
const stage=document.getElementById('stage'),film=document.getElementById('film'),intro=document.getElementById('intro'),play=document.getElementById('play'),status=document.getElementById('status');
function showIntro(message=''){intro.hidden=false;stage.classList.remove('playing');status.textContent=message;status.hidden=!message;play.textContent=film.currentTime>0&&!film.ended?'RESUME':'PLAY';}
play.addEventListener('click',()=>{
  intro.hidden=true;stage.classList.add('playing');
  if(film.ended)film.currentTime=0;
  const playback=film.play();
  if(!document.fullscreenElement&&stage.requestFullscreen)stage.requestFullscreen().catch(()=>{});
  playback.catch(()=>showIntro('Playback could not start. Please try again.'));
});
film.addEventListener('ended',()=>{film.currentTime=0;showIntro();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});});
film.addEventListener('error',()=>showIntro('The film could not be loaded. Please try again later.'));
film.addEventListener('click',()=>{if(!film.paused){film.pause();showIntro();}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&intro.hidden){e.preventDefault();film.pause();showIntro();}});
</script>
</body>
</html>
