<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Visualizer – Untitled (132 BPM) v3</title>
<style>
html,body{margin:0;height:100%;background:#050403;overflow:hidden;font:400 12px/22px Arial,sans-serif;color:#332e27}
#wrap{position:relative;width:100%;height:100vh;overflow:hidden;background:#030201}
canvas{position:absolute;inset:0;width:100%;height:100%}
#scene{z-index:1}
#colour{z-index:2;mix-blend-mode:multiply;opacity:.78}
#damage{z-index:3;mix-blend-mode:screen;opacity:.98}
#dirt{z-index:4;mix-blend-mode:multiply;opacity:.70}
#vignette{position:absolute;inset:-5%;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,241,202,.05) 0%,rgba(0,0,0,0) 42%,rgba(0,0,0,.80) 100%),linear-gradient(90deg,rgba(0,0,0,.52),transparent 13%,transparent 87%,rgba(0,0,0,.52))}
#frame{position:absolute;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,241,203,.05),inset 0 0 90px rgba(0,0,0,.9)}
.ui{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:.75rem;padding:.6rem .8rem;background:rgba(239,232,213,.88);opacity:0;transform:translateY(8px);transition:.25s ease;pointer-events:none}
#wrap:hover .ui,#wrap.ui-open .ui{opacity:1;transform:none;pointer-events:auto}
.btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:9999px;text-align:center;background:rgba(0,0,0,.06)}
.label{min-width:52px;text-align:right;opacity:.85}.grow{flex:1}.spacer{width:8px}
input[type=range]{appearance:none;height:4px;width:240px;background:rgba(0,0,0,.18);border-radius:999px}
input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#3e3a33}
.starter{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:32px;
  background:
    linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.55)),
    radial-gradient(circle at 50% 42%,rgba(110,92,66,.18),transparent 34%),
    linear-gradient(180deg,#17130f,#030201 72%);
}
.track-title{
  font-size:clamp(26px,3.4vw,36px);
  color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.9);
}
.play-oval{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:140px;height:50px;border-radius:9999px;background:rgba(220,207,163,.72);border:2px solid rgba(105,92,55,.9);box-shadow:0 6px 24px rgba(0,0,0,.5)}
.play-oval svg{width:20px;height:20px;fill:#4a4021}
.hiddenVideo{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.load-status{min-height:22px;color:#fff;font-size:14px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.play-oval:disabled{cursor:wait;opacity:.72}
@media (prefers-reduced-motion:reduce){.ui{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="scene"></canvas>
  <canvas id="colour"></canvas>
  <canvas id="damage"></canvas>
  <canvas id="dirt"></canvas>
  <div id="vignette"></div><div id="frame"></div>
  <div class="ui">
    <button id="play" class="btn">▶</button><span id="time" class="label">0:00</span>
    <input id="seek" type="range" min="0" max="1" step="0.001" value="0" class="grow">
    <span id="dur" class="label">6:02</span><div class="spacer"></div>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" style="width:110px">
  </div>
  <div id="starter" class="starter">
    <div class="track-title">UNTITLED</div>
    <!-- v3: scored symbols, cold scratches, recurring duotone echoes and closing accumulation -->
    <button id="startBtn" class="play-oval" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div id="loadStatus" class="load-status" aria-live="polite"></div>
  </div>
  <audio id="audio" preload="metadata" crossorigin="anonymous"><source src="paris.mp3" type="audio/mpeg"></audio>
</div>

<script>
const BPM=132, BEATS_PER_BAR=4, TRACK_BARS=199;
const SECONDS_PER_BAR=BEATS_PER_BAR*60/BPM;
const TRACK_SECONDS=TRACK_BARS*SECONDS_PER_BAR;
const MUSICAL_END=355; // 5:55 — fade begins here; remaining audio is treated as tail
const CLOSE_BUILD_START=342; // 5:42 — begin accumulating image layers
const atBar=bar=>(bar-1)*SECONDS_PER_BAR;

// Brief returns of the opening's saturated, displaced afterimage language.
// Each window fades in and out rather than switching abruptly.
const DUOTONE_WINDOWS=[
  {start:104.5,end:110.5,strength:.72},
  {start:168.0,end:174.5,strength:.82},
  {start:241.5,end:247.0,strength:.78},
  {start:300.0,end:306.5,strength:.90}
];
function windowEnvelope(t,start,end,edge=.9){
  if(t<start||t>end)return 0;
  return Math.min(1,(t-start)/edge,(end-t)/edge);
}
function duotoneAmount(t){
  let amount=0;
  for(const q of DUOTONE_WINDOWS)amount=Math.max(amount,windowEnvelope(t,q.start,q.end)*q.strength);
  // The opening establishes the effect, then relinquishes it during the first section.
  if(t<18)amount=Math.max(amount,clamp(1-t/18,0,1)*.88);
  return amount;
}
function closingBuildAmount(t){return clamp((t-CLOSE_BUILD_START)/(MUSICAL_END-CLOSE_BUILD_START),0,1);}

const VIDEO_BASE="https://pub-72e9e2f20fd24867ab095d7021d419db.r2.dev/paris_videos/";
const CLIPS={
  dropout:VIDEO_BASE+"dropout.mp4",
  freespirit:VIDEO_BASE+"freespirit.mp4",
  holiday:VIDEO_BASE+"holiday.mp4",
  home:VIDEO_BASE+"home.mp4",
  kids:VIDEO_BASE+"kids.mp4",
  parade:VIDEO_BASE+"parade.mp4",
  showtime:VIDEO_BASE+"showtime.mp4",
  watchers:VIDEO_BASE+"watchers.mp4",
  weimer:VIDEO_BASE+"weimer.mp4"
};
const SEQUENCES=[
  ["holiday","home","kids"],
  ["parade","freespirit","dropout"],
  ["showtime","weimer","watchers"],
  ["home","watchers","holiday"],
  ["kids","showtime","parade"],
  ["dropout","weimer","freespirit"]
];
const TIMELINE=[
  {at:atBar(1),name:"memory",wash:null,washA:0,bleach:.18,flicker:.10,damage:.18,scratch:.12,cutMin:3.6,cutMax:6.5,repeats:2,slow:.58,openingRamp:true,symbols:.20},
  {at:atBar(33),name:"inscription",wash:"rgba(112,86,48,",washA:.17,bleach:.12,flicker:.18,damage:.28,scratch:.30,cutMin:2.6,cutMax:4.4,repeats:2,slow:.56,symbols:.52},
  {at:atBar(65),name:"apparition",wash:"rgba(42,86,92,",washA:.20,bleach:.10,flicker:.28,damage:.40,scratch:.44,cutMin:2.0,cutMax:3.4,repeats:2,slow:.52,symbols:.72,ghost:.16},
  {at:atBar(97),name:"possession",wash:"rgba(92,42,67,",washA:.22,bleach:.08,flicker:.44,damage:.56,scratch:.62,cutMin:1.4,cutMax:2.7,repeats:3,slow:.48,symbols:.92,ghost:.26},
  {at:atBar(129),name:"rupture",wash:null,washA:0,bleach:.58,flicker:.62,damage:.76,scratch:.82,cutMin:.75,cutMax:1.8,repeats:3,slow:.28,symbols:1,ghost:.36,white:.08},
  {at:atBar(161),name:"transmission",wash:"rgba(118,32,18,",washA:.24,bleach:.14,flicker:.48,damage:.68,scratch:.72,cutMin:1.1,cutMax:2.2,repeats:3,slow:.50,symbols:1,ghost:.42},
  {at:CLOSE_BUILD_START,name:"coda",wash:null,washA:0,bleach:.72,flicker:.20,damage:.88,scratch:.92,cutMin:.45,cutMax:1.1,repeats:3,slow:.20,symbols:1,ghost:.55,outro:true,white:.18}
];

const wrap=document.getElementById('wrap');
const sceneCanvas=document.getElementById('scene'), colourCanvas=document.getElementById('colour'), damageCanvas=document.getElementById('damage'), dirtCanvas=document.getElementById('dirt');
const s=sceneCanvas.getContext('2d',{alpha:false}), col=colourCanvas.getContext('2d',{alpha:true}), d=damageCanvas.getContext('2d',{alpha:true}), di=dirtCanvas.getContext('2d',{alpha:true});
const audio=document.getElementById('audio'), starter=document.getElementById('starter'), startBtn=document.getElementById('startBtn'), loadStatus=document.getElementById('loadStatus'), btnPlay=document.getElementById('play');
const rSeek=document.getElementById('seek'), rVol=document.getElementById('vol'), tTime=document.getElementById('time'), tDur=document.getElementById('dur');

let audioCtx,src,gain,analyser,freqData,timeData,vids={},isPlaying=false,frame=0,lastBeat=-1,lastBar=-1;
let seq=0,rep=0,clip=0,nextChange=0,gateX=0,gateY=0,hardFlash=0,loopFrames=0,loopTime=0,tearFlash=0,modeUntil=0,scratchMode='worn';
let gestures=[],burns=[];
let startChosen=false,activeDrawVid=null,quality=1,fpsFrames=0,fpsStarted=performance.now(),uiTimer=0;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');

const pad=x=>(x<10?'0':'')+x;
const fmt=t=>(!isFinite(t)?'0:00':((t/60)|0)+':'+pad((t%60)|0));
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function paramsAt(t){let p=TIMELINE[0];for(const q of TIMELINE){if(t>=q.at)p=q;else break;}return p;}

function beatPhase(t){
 const beatDur = 60 / BPM;
 return (t % beatDur) / beatDur;
}
function nearKick(t, window=0.09){
 const ph = beatPhase(t);
 return ph < window || ph > 1-window;
}
function beatIndex(t){
 return Math.floor(t * BPM / 60);
}
function isBarStart(t){
 return beatIndex(t) % 4 === 0 && nearKick(t,.11);
}
function grindMoment(t){
 // Deliberate dense moments where the footage almost stops.
 return (t>137 && t<141) || (t>220 && t<224) || (t>288 && t<293);
}


function resize(){
 const r=wrap.getBoundingClientRect();
 const mobile=matchMedia('(max-width:700px)').matches;
 const dpr=Math.min(devicePixelRatio||1,mobile?1.25:2);
 [sceneCanvas,colourCanvas,damageCanvas,dirtCanvas].forEach(c=>{c.width=Math.floor(r.width*dpr);c.height=Math.floor(r.height*dpr);c.style.width=r.width+'px';c.style.height=r.height+'px';});
 [s,col,d,di].forEach(cx=>cx.setTransform(dpr,0,0,dpr,0,0));
}
addEventListener('resize',resize,{passive:true}); resize();

function chooseRandomStart(){
 if(startChosen)return;
 seq=Math.floor(Math.random()*SEQUENCES.length);
 clip=Math.floor(Math.random()*SEQUENCES[seq].length);
 rep=0;
 startChosen=true;
}
function makeVideos(){
 const firstName=SEQUENCES[seq][clip];
 for(const [k,u] of Object.entries(CLIPS)){
  const v=document.createElement('video');
  v.className='hiddenVideo'; v.src=u; v.crossOrigin='anonymous'; v.loop=true; v.muted=true; v.playsInline=true;
  v.preload=k===firstName?'auto':'metadata'; v.playbackRate=.55;
  document.body.appendChild(v); vids[k]=v;
 }
}
function currentVid(){return vids[SEQUENCES[seq][clip]];}
function pauseOtherVideos(keep){
 for(const v of Object.values(vids)){if(v!==keep&&!v.paused)v.pause();}
}
async function activateVideo(v){
 if(!v)return;
 v.preload='auto';
 try{
  await v.play();
  if(v.readyState>=2){activeDrawVid=v;pauseOtherVideos(v);}
 }catch(e){console.warn('video issue',v.src,e);}
}
function warmUpcomingVideos(){
 const names=[];
 const currentSequence=SEQUENCES[seq];
 names.push(currentSequence[(clip+1)%currentSequence.length]);
 names.push(currentSequence[(clip+2)%currentSequence.length]);
 names.push(SEQUENCES[(seq+1)%SEQUENCES.length][0]);
 for(const name of new Set(names)){
  const v=vids[name];
  if(v&&v.preload!=='auto'){v.preload='auto';v.load();}
 }
}
function advanceClip(){
 const p=paramsAt(audio.currentTime);
 clip++;
 if(clip>=SEQUENCES[seq].length){clip=0;rep++;if(rep>=p.repeats){rep=0;seq=(seq+1)%SEQUENCES.length;}}
 const v=currentVid();
 activateVideo(v);
 warmUpcomingVideos();
 if(v&&v.duration&&isFinite(v.duration)){try{v.currentTime=rand(0,Math.max(.25,v.duration-1.2));}catch(e){} v.playbackRate=p.slow+rand(-.06,.08);}
 nextChange=audio.currentTime+rand(p.cutMin,p.cutMax);
 hardFlash=.06+Math.random()*.08;
 if(Math.random()<.12+p.damage*.12 || grindMoment(audio.currentTime)){loopFrames=Math.floor(rand(6, grindMoment(audio.currentTime)?34:16)); if(v)loopTime=v.currentTime;}
}
function setupAudio(){
 const AC=AudioContext||webkitAudioContext; audioCtx=new AC();
 src=audioCtx.createMediaElementSource(audio); gain=audioCtx.createGain(); gain.gain.value=Number(rVol.value);
 analyser=audioCtx.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=.66;
 freqData=new Uint8Array(analyser.frequencyBinCount); timeData=new Uint8Array(analyser.fftSize);
 src.connect(gain); gain.connect(analyser); gain.connect(audioCtx.destination);
}
function band(a,b){
 if(!freqData||!audioCtx)return 0;
 const ny=audioCtx.sampleRate/2, sidx=Math.floor(a/ny*freqData.length), eidx=Math.floor(b/ny*freqData.length);
 let sum=0,n=0; for(let i=sidx;i<=eidx&&i<freqData.length;i++){sum+=freqData[i];n++;}
 return n?sum/(n*255):0;
}
function rms(){if(!timeData)return 0;let sum=0;for(let i=0;i<timeData.length;i++){const v=(timeData[i]-128)/128;sum+=v*v;}return Math.sqrt(sum/timeData.length);}
function drawCover(ctx,v,w,h,alpha=1,dx=0,dy=0,zoom=1){
 if(!v||v.readyState<2)return false;
 const scale=Math.max(w/v.videoWidth,h/v.videoHeight)*zoom,dw=v.videoWidth*scale,dh=v.videoHeight*scale;
 ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(v,(w-dw)/2+dx,(h-dh)/2+dy,dw,dh);ctx.restore();return true;
}
function drawDuotoneEcho(ctx,v,w,h,amount,bass,highs){
 if(!v||v.readyState<2||amount<=0)return;
 const shift=(6+bass*14)*amount;
 ctx.save();
 ctx.globalCompositeOperation='screen';
 ctx.filter=`grayscale(.18) contrast(${1.22+amount*.45}) saturate(${1.55+amount*1.35}) sepia(.18) hue-rotate(-22deg)`;
 drawCover(ctx,v,w,h,.17*amount,-shift,highs*4,1.045+amount*.018);
 ctx.filter=`grayscale(.08) contrast(${1.16+amount*.36}) saturate(${1.7+amount*1.5}) sepia(.08) hue-rotate(142deg)`;
 drawCover(ctx,v,w,h,.14*amount,shift,-bass*5,1.055+amount*.022);
 ctx.globalCompositeOperation='source-over';
 ctx.restore();
}
function drawClosingAccumulation(ctx,w,h,amount,bass){
 if(amount<=0)return;
 const ready=Object.values(vids).filter(v=>v&&v.readyState>=2);
 if(!ready.length)return;
 const layers=Math.min(9,2+Math.floor(amount*8));
 ctx.save();
 for(let i=0;i<layers;i++){
  const v=ready[(frame+i*3)%ready.length];
  const phase=i/Math.max(1,layers-1);
  ctx.globalCompositeOperation=i%3===0?'screen':(i%3===1?'lighter':'source-over');
  ctx.filter=`grayscale(${.22+phase*.42}) contrast(${1.06+amount*.46}) saturate(${.65+amount*.85}) sepia(${.10+phase*.18})`;
  const spread=(10+amount*44)*(phase-.5);
  drawCover(ctx,v,w,h,(.035+amount*.055)*(1-phase*.28),spread+rand(-3,3),-spread*.45+rand(-3,3),1.025+phase*.055+bass*.012);
 }
 ctx.filter='none';ctx.globalCompositeOperation='source-over';ctx.restore();
}
function updateScratchMode(t,p,bass,highs,barPulse){
 if(t>modeUntil||barPulse&&Math.random()<.32){
  const r=Math.random();
  if(r<.42-p.damage*.18)scratchMode='worn';
  else if(r<.78-p.damage*.08)scratchMode='damaged';
  else scratchMode='vandalised';
  modeUntil=t+rand(1.6,5.5);
 }
 if(bass>.64||highs>.70||p.outro&&Math.random()<.18){scratchMode='vandalised';modeUntil=t+rand(.6,1.8);}
}
const SYMBOL_KINDS=new Set(['spiral','nest','square','triangle','arrow','eye','sigil','vesica','sun','fork','hex']);
function spawnGesture(w,h,p,kindOverride=null){
 const kinds=['forest','slash','spiral','nest','claw','scribble','xmarks','scrape','square','triangle','arrow','parallel','collapsing','eye','sigil','vesica','sun','fork','hex'];
 const kind=kindOverride||kinds[Math.floor(Math.random()*kinds.length)];
 const symbol=SYMBOL_KINDS.has(kind);
 const viewportScale=clamp(Math.min(w,h)/900,.62,1.45);
 const life=symbol?Math.floor(rand(42,150)):Math.floor(rand(3,18));
 const toneRoll=Math.random();
 const tone=toneRoll<.66?'ochre':toneRoll<.90?'chalk':'rust';
 gestures.push({
  kind,symbol,tone,
  x:rand(w*.08,w*.92),y:rand(h*.08,h*.92),
  r:rand(w*.08,w*.42)*(1+p.scratch*.5),len:rand(w*.30,w*1.2),
  angle:rand(-Math.PI,Math.PI),life,maxLife:life,
  alpha:symbol?rand(.38,.78)*(0.68+p.symbols*.34):rand(.16,.58)*(0.42+p.scratch*.48),
  width:symbol?rand(5.2,10.8)*viewportScale:rand(.65,2.2)*viewportScale,
  seed:Math.random()*1000
 });
 gestures=gestures.slice(-30);
}
function tracePoints(ctx,pts,dx=0,dy=0){
 ctx.beginPath();
 pts.forEach((p,i)=>{if(i===0)ctx.moveTo(p[0]+dx,p[1]+dy);else ctx.lineTo(p[0]+dx,p[1]+dy);});
}
function drawScratchLine(ctx,pts,width,alpha,dark=false){
 ctx.save();ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.strokeStyle=dark?`rgba(8,7,6,${alpha})`:`rgba(225,231,226,${alpha})`;
 ctx.shadowColor=dark?'transparent':`rgba(255,255,255,${alpha*.18})`;ctx.shadowBlur=dark?0:width*.35;
 tracePoints(ctx,pts);ctx.stroke();ctx.restore();
}
function drawSymbolLine(ctx,pts,width,alpha,tone='ochre'){
 const colours={
  chalk:`rgba(226,211,171,${alpha})`,
  ochre:`rgba(205,173,112,${alpha})`,
  rust:`rgba(164,76,48,${alpha})`
 };
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 ctx.lineWidth=width*1.72;ctx.strokeStyle=`rgba(15,10,7,${alpha*.50})`;tracePoints(ctx,pts,2.2,2.2);ctx.stroke();
 ctx.lineWidth=width;ctx.strokeStyle=colours[tone]||colours.ochre;tracePoints(ctx,pts);ctx.stroke();
 ctx.lineWidth=Math.max(.7,width*.16);ctx.strokeStyle=`rgba(246,232,194,${alpha*.48})`;
 tracePoints(ctx,pts.map(([x,y])=>[x+rand(-1.2,1.2),y+rand(-1.2,1.2)]));ctx.stroke();ctx.restore();
}
function drawJaggedLine(ctx,pts,width,alpha,asSymbol=false,tone='ochre'){
 if(asSymbol)drawSymbolLine(ctx,pts,width,alpha,tone);else drawScratchLine(ctx,pts,width,alpha,Math.random()<.08);
}
function roughShapeLine(points,width,alpha,tone='ochre'){
 drawSymbolLine(d,points.map(pt=>[pt[0]+rand(-5,5),pt[1]+rand(-5,5)]),width,alpha,tone);
}

function drawGesture(g,w,h,p,bass,highs){
 const f=clamp(g.life/g.maxLife,0,1),a=g.alpha*(.35+f*.65);
 const degenerate=(1-f)*p.scratch + bass*.35;
 d.save();d.translate(g.x,g.y);d.rotate(g.angle+Math.sin((frame+g.seed)*.08)*.05);
 if(g.kind==='forest'){
  const count=Math.floor(5+p.scratch*16+highs*10);
  for(let i=0;i<count;i++){const x=rand(-g.r,g.r),len=rand(h*.25,h*.95);let pts=[];for(let k=0;k<7;k++)pts.push([x+rand(-12,12),-len*.5+k*len/6+rand(-18,18)]);drawJaggedLine(d,pts,g.width*rand(.55,1.15),a*rand(.45,.95));}
 }else if(g.kind==='parallel'){
  const count=Math.floor(rand(4,12)+p.scratch*8);
  for(let c=0;c<count;c++){const off=(c-count/2)*rand(10,22);let pts=[],len=g.len*rand(.35,.9);for(let k=0;k<8;k++)pts.push([-len*.5+k*len/7,off+Math.sin(k+frame*.11)*10+rand(-7,7)]);drawJaggedLine(d,pts,g.width*rand(.45,1.2),a*rand(.55,1));}
 }else if(g.kind==='slash'){
  const count=Math.floor(rand(1,5));
  for(let j=0;j<count;j++){let pts=[],len=g.len*rand(.45,1);for(let k=0;k<9;k++)pts.push([-len*.5+k*len/8,rand(-40,40)+Math.sin(k+frame*.2)*20]);drawJaggedLine(d,pts,g.width*rand(.8,1.7),a);}
 }else if(g.kind==='spiral'||g.kind==='nest'){
  const turns=g.kind==='nest'?5.8:3.4,count=g.kind==='nest'?3:1;
  const pulse=1+Math.sin(frame*.09+g.seed)*(.18+p.scratch*.25);
  for(let c=0;c<count;c++){let pts=[];for(let i=0;i<80;i++){const ang=i*.23+c*.7+Math.sin(frame*.04)*.12,rr=(i/80)*g.r*pulse*(1+rand(-.04,.04));pts.push([Math.cos(ang*turns/3)*rr+rand(-6,6)*degenerate,Math.sin(ang*turns/3)*rr+rand(-6,6)*degenerate]);}drawSymbolLine(d,pts,g.width*rand(.82,1.08),a*rand(.58,.96),g.tone);}
 }else if(g.kind==='square'){
  const r=g.r*(.55+Math.sin(frame*.08+g.seed)*.18);
  const pts=[[-r,-r],[r,-r],[r,r],[-r,r],[-r,-r]];
  for(let k=0;k<2+Math.floor(p.scratch*3);k++) roughShapeLine(pts,g.width*rand(.86,1.12),a*rand(.62,.94),g.tone);
 }else if(g.kind==='triangle'){
  const r=g.r*(.65+Math.sin(frame*.07+g.seed)*.22);
  const pts=[[0,-r],[r*.9,r*.7],[-r*.9,r*.7],[0,-r]];
  for(let k=0;k<2+Math.floor(p.scratch*3);k++) roughShapeLine(pts,g.width*rand(.86,1.12),a*rand(.62,.94),g.tone);
 }else if(g.kind==='arrow'){
  const len=g.len*rand(.25,.7);
  const pts=[[-len*.5,0],[len*.5,0],[len*.28,-len*.18],[len*.5,0],[len*.28,len*.18]];
  for(let k=0;k<2+Math.floor(p.scratch*3);k++) roughShapeLine(pts,g.width*rand(.86,1.12),a*rand(.62,.95),g.tone);
 }else if(g.kind==='eye'){
  const r=g.r*.75, pts=[];for(let i=0;i<=32;i++){const x=-r+i*(2*r/32),y=Math.sin(i/32*Math.PI)*r*.42;pts.push([x,y]);}for(let i=32;i>=0;i--){const x=-r+i*(2*r/32),y=-Math.sin(i/32*Math.PI)*r*.42;pts.push([x,y]);}pts.push(pts[0]);roughShapeLine(pts,g.width,a,g.tone);const pupil=[];for(let i=0;i<=28;i++){const q=i/28*Math.PI*2;pupil.push([Math.cos(q)*r*.20,Math.sin(q)*r*.20]);}drawSymbolLine(d,pupil,g.width*.82,a,g.tone);
 }else if(g.kind==='vesica'){
  for(const off of [-g.r*.28,g.r*.28]){const ring=[];for(let i=0;i<=40;i++){const q=i/40*Math.PI*2;ring.push([off+Math.cos(q)*g.r*.55,Math.sin(q)*g.r*.55]);}drawSymbolLine(d,ring,g.width*rand(.78,1.05),a*.85,g.tone);}
 }else if(g.kind==='sun'){
  const ring=[];for(let i=0;i<=40;i++){const q=i/40*Math.PI*2;ring.push([Math.cos(q)*g.r*.32,Math.sin(q)*g.r*.32]);}drawSymbolLine(d,ring,g.width,a,g.tone);for(let i=0;i<12;i++){const q=i*Math.PI/6;drawSymbolLine(d,[[Math.cos(q)*g.r*.45,Math.sin(q)*g.r*.45],[Math.cos(q)*g.r*.82,Math.sin(q)*g.r*.82]],g.width*.72,a*.8,g.tone);}
 }else if(g.kind==='hex'){
  for(const flip of [1,-1]){const pts=[];for(let i=0;i<3;i++){const q=-Math.PI/2+i*Math.PI*2/3;pts.push([Math.cos(q)*g.r*.72,Math.sin(q)*g.r*.72*flip]);}pts.push(pts[0]);roughShapeLine(pts,g.width,a*.9,g.tone);}
 }else if(g.kind==='fork'){
  const r=g.r*.75;roughShapeLine([[0,r],[0,-r*.25],[-r*.42,-r*.72],[0,-r*.25],[r*.42,-r*.72]],g.width,a,g.tone);
 }else if(g.kind==='sigil'){
  const pts=[[0,-g.r*.85],[g.r*.18,-g.r*.28],[-g.r*.38,g.r*.05],[g.r*.42,g.r*.28],[-g.r*.12,g.r*.78],[0,-g.r*.85]];roughShapeLine(pts,g.width,a,g.tone);const ring=[];for(let i=0;i<=42;i++){const q=i/42*Math.PI*2;ring.push([Math.cos(q)*g.r*.68,Math.sin(q)*g.r*.68]);}drawSymbolLine(d,ring,g.width*.65,a*.55,g.tone);
 }else if(g.kind==='collapsing'){
  let pts=[]; const n=50;
  for(let i=0;i<n;i++){const rr=g.r*(1-i/n)*(1+Math.sin(frame*.11+i)*.25);const ang=i*.55+frame*.04;pts.push([Math.cos(ang)*rr+rand(-22,22)*degenerate,Math.sin(ang)*rr+rand(-22,22)*degenerate]);}
  drawJaggedLine(d,pts,g.width*rand(.7,1.5),a);
 }else if(g.kind==='claw'){
  const count=Math.floor(rand(4,9));
  for(let c=0;c<count;c++){const off=(c-count/2)*rand(12,24);let pts=[],len=g.len*rand(.25,.65);for(let k=0;k<8;k++)pts.push([-len*.5+k*len/7,off+Math.sin(k*.9+frame*.12)*14+rand(-10,10)]);drawJaggedLine(d,pts,g.width*rand(.45,1),a*rand(.55,1));}
 }else if(g.kind==='xmarks'){
  const count=Math.floor(rand(3,12));
  for(let c=0;c<count;c++){const x=rand(-g.r,g.r),y=rand(-g.r,g.r),sz=rand(12,45);drawJaggedLine(d,[[x-sz,y-sz],[x+sz,y+sz]],g.width*.55,a*.8);drawJaggedLine(d,[[x+sz,y-sz],[x-sz,y+sz]],g.width*.55,a*.8);}
 }else if(g.kind==='scrape'){
  const count=Math.floor(rand(5,16));
  for(let c=0;c<count;c++){let pts=[],yy=rand(-g.r,g.r),len=g.len*rand(.2,.55);for(let k=0;k<5;k++)pts.push([-len*.5+k*len/4,yy+rand(-18,18)]);drawJaggedLine(d,pts,g.width*rand(.4,1.1),a*rand(.35,.75));}
 }else{
  let pts=[];for(let i=0;i<50;i++)pts.push([rand(-g.r,g.r),rand(-g.r,g.r)]);drawJaggedLine(d,pts,g.width*.6,a*.65);
 }
 d.restore();
}

function drawScratchGestures(w,h,p,bass,highs,beatPulse,barPulse){
 let spawn=0;
 if(scratchMode==='worn')spawn=.018+p.scratch*.025+highs*.04;
 if(scratchMode==='damaged')spawn=.055+p.scratch*.07+highs*.08;
 if(scratchMode==='vandalised')spawn=.14+p.scratch*.13+highs*.16+bass*.10;
 const tNow=audio.currentTime;
 const grind=grindMoment(tNow);
 if(p.openingRamp) spawn += .045;
 if(grind) spawn += .24;
 const closeBuild=closingBuildAmount(tNow);
 if(closeBuild>0)spawn += closeBuild*.22;

 // Most major geometry changes are beat-locked: kicks, half-bars and bars.
 const beatLocked = nearKick(tNow,.12);
 if(beatLocked && Math.random()<spawn*1.35) spawnGesture(w,h,p,Math.random()<.72?'slash':null);
 if(beatPulse && Math.random()<p.scratch*.18+bass*.14) spawnGesture(w,h,p,scratchMode==='vandalised'?'slash':null);
 if(barPulse && (scratchMode==='vandalised'||grind) && Math.random()<.34) spawnGesture(w,h,p,'forest');
 if(barPulse && Math.random()<.20+p.symbols*.32+closeBuild*.44){const symbols=['triangle','spiral','eye','vesica','sun','fork','hex','sigil','square'];spawnGesture(w,h,p,symbols[Math.floor(Math.random()*symbols.length)]);}
 if(closeBuild>.35&&beatPulse&&Math.random()<closeBuild*.22)spawnGesture(w,h,p,Math.random()<.68?'sigil':'eye');

 gestures=gestures.filter(g=>g.life-- > 0);
 for(const g of gestures)drawGesture(g,w,h,p,bass,highs);

 const baseHair = grind ? 10 : (scratchMode==='worn'?0:scratchMode==='damaged'?2:4);
 const hairCount=Math.floor(baseHair+highs*(grind?18:(scratchMode==='vandalised'?8:3)));
 for(let i=0;i<hairCount;i++){const x=rand(0,w),alpha=rand(.06,.28)*(0.55+p.scratch),dark=Math.random()<.12;d.strokeStyle=dark?`rgba(5,5,5,${alpha*.85})`:`rgba(216,225,222,${alpha})`;d.lineWidth=rand(.45,1.55);d.beginPath();d.moveTo(x,rand(-h*.1,h*.9));d.bezierCurveTo(x+rand(-40,40),rand(0,h),x+rand(-40,40),rand(0,h),x+rand(-35,35),rand(h*.1,h*1.1));d.stroke();}
}
function drawColour(w,h,p){
 col.clearRect(0,0,w,h);
 if(p.wash&&p.washA>0){col.fillStyle=p.wash+p.washA+")";col.fillRect(0,0,w,h);const g=col.createRadialGradient(w*.45,h*.45,10,w*.5,h*.55,w*.7);g.addColorStop(0,p.wash+(p.washA*.55)+")");g.addColorStop(1,"rgba(0,0,0,0)");col.fillStyle=g;col.fillRect(0,0,w,h);}
}
function drawBurns(w,h,bass,p){
 if(Math.random()<.002+bass*.016+p.damage*.008)burns.push({x:rand(w*.1,w*.9),y:rand(h*.1,h*.9),r:rand(90,260)*(1+bass+p.damage),life:rand(18,58)});
 burns=burns.filter(b=>b.life-- > 0).slice(-8);
 for(const b of burns){const f=clamp(b.life/58,0,1),r=b.r*(1.18-f*.18),g=d.createRadialGradient(b.x,b.y,0,b.x,b.y,r);g.addColorStop(0,`rgba(255,250,222,${(.14+bass*.22)*f})`);g.addColorStop(.25,`rgba(235,112,38,${(.08+bass*.10)*f})`);g.addColorStop(.68,`rgba(65,18,7,${(.10+p.damage*.12)*f})`);g.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=g;d.beginPath();d.arc(b.x,b.y,r,0,Math.PI*2);d.fill();}
}
function drawDirt(w,h,bass,highs,p){
 di.clearRect(0,0,w,h);di.fillStyle='rgba(0,0,0,.30)';di.fillRect(0,0,22,h);di.fillRect(w-22,0,22,h);di.fillStyle=`rgba(0,0,0,${.22+bass*.10})`;
 for(let y=-20;y<h+40;y+=42){di.fillRect(9+Math.sin(frame*.03+y)*2,y,13,19);di.fillRect(w-22+Math.sin(frame*.03+y)*2,y+8,13,19);}
 const dust=Math.floor((55+highs*85+p.damage*60)*quality*(reducedMotion.matches?.72:1));
 for(let i=0;i<dust;i++){const dark=Math.random()<.64;di.fillStyle=dark?`rgba(0,0,0,${rand(.012,.050)})`:`rgba(255,245,220,${rand(.010,.040)})`;di.beginPath();di.arc(rand(0,w),rand(0,h),Math.random()<.9?rand(.3,1.6):rand(2,5),0,Math.PI*2);di.fill();}
}
function monitorPerformance(){
 fpsFrames++;
 const now=performance.now(),elapsed=now-fpsStarted;
 if(elapsed>=4000){
  const fps=fpsFrames*1000/elapsed;
  quality=fps<32?.62:fps<45?.80:1;
  fpsFrames=0;fpsStarted=now;
 }
}
function render(){
 requestAnimationFrame(render);
 monitorPerformance();
 const w=wrap.clientWidth,h=wrap.clientHeight;
 if(!isPlaying||!analyser){s.fillStyle='#15100a';s.fillRect(0,0,w,h);return;}
 frame++;analyser.getByteFrequencyData(freqData);analyser.getByteTimeDomainData(timeData);
 const t=audio.currentTime,p=paramsAt(t),duotone=duotoneAmount(t),closeBuild=closingBuildAmount(t),bass=clamp(band(35,165)*1.45,0,1),highs=clamp(band(2600,9000)*1.55,0,1),mids=clamp(band(520,2600)*1.2,0,1),energy=clamp(rms()*2.7,0,1);
 const beat=Math.floor(t*BPM/60),bar=Math.floor(beat/BEATS_PER_BAR),beatPulse=beat!==lastBeat,barPulse=bar!==lastBar;
 if(beatPulse){lastBeat=beat;if(bass>.28||scratchMode==='vandalised'){gateX=rand(-9,9)*(bass+p.damage);gateY=rand(-6,6)*(bass+p.damage);}if(bass>.58)tearFlash=.18;}
 if(barPulse){lastBar=bar;if(Math.random()<.16+p.damage*.24)burns.push({x:rand(w*.1,w*.9),y:rand(h*.1,h*.9),r:rand(120,360)*(1+bass),life:rand(20,52)});}
 if(t>nextChange)advanceClip();
 updateScratchMode(t,p,bass,highs,barPulse);
 const candidate=currentVid();
 if(candidate&&candidate.readyState>=2)activeDrawVid=candidate;
 const v=activeDrawVid||candidate;
 if(loopFrames>0&&v&&v.duration){
 loopFrames--;
 const amp = grindMoment(t) ? .035 : .09;
 try{v.currentTime=loopTime+Math.sin(loopFrames*.9)*amp;}catch(e){}
}
if(grindMoment(t)&&v&&v.duration&&Math.random()<.55){
 try{v.playbackRate=.16+Math.random()*.10;}catch(e){}
}
 s.fillStyle=`rgba(5,3,1,${.045+p.damage*.020})`;s.fillRect(0,0,w,h);
 const bleach=p.bleach||0,bright=.56+energy*.10+bleach*.44,contrast=.78+mids*.13-bleach*.16,sat=.68-p.damage*.16-bleach*.50;
 s.filter=`sepia(${.32+p.damage*.10}) grayscale(${.20+p.damage*.18+bleach*.44}) contrast(${contrast}) brightness(${bright}) saturate(${sat})`;
 const openingVis=p.openingRamp?clamp((t/atBar(33))**1.55,0.025,1):1;
 drawCover(s,v,w,h,openingVis,gateX+rand(-.4,.4),gateY+rand(-.4,.4),1.035+p.damage*.028);
 if(p.damage>.28&&Math.random()<.08+p.damage*.18){const names=SEQUENCES[(seq+1)%SEQUENCES.length],v2=vids[names[Math.floor(Math.random()*names.length)]];s.globalCompositeOperation='screen';drawCover(s,v2,w,h,.07+p.damage*.11,-gateX*1.5+rand(-8,8),-gateY*1.5+rand(-6,6),1.06);s.globalCompositeOperation='source-over';}
 s.filter='none';
 drawDuotoneEcho(s,v,w,h,duotone,bass,highs);
 drawClosingAccumulation(s,w,h,closeBuild,bass);
 const flick=(Math.random()<p.flicker)?rand(.04,.22)*p.flicker:0;
 s.fillStyle=`rgba(226,209,170,${.065+p.damage*.10+flick})`;s.fillRect(0,0,w,h);
 if(hardFlash>0){s.fillStyle=`rgba(255,244,215,${hardFlash})`;s.fillRect(0,0,w,h);hardFlash*=.74;}
 gateX*=.82;gateY*=.82;
 drawColour(w,h,p);
 if(duotone>0){
   col.globalCompositeOperation='screen';
   col.fillStyle=`rgba(164,55,38,${duotone*.075})`;col.fillRect(0,0,w,h);
   col.globalCompositeOperation='source-over';
 }
 d.clearRect(0,0,w,h);drawBurns(w,h,bass,p);drawScratchGestures(w,h,p,bass,highs,beatPulse,barPulse);
 if(Math.random()<.026+bass*.025+p.flicker*.045){d.fillStyle=`rgba(255,243,214,${.05+bass*.16+p.flicker*.10})`;d.fillRect(0,0,w,h);}
 if(tearFlash>0){d.fillStyle=`rgba(0,0,0,${tearFlash})`;d.fillRect(0,rand(0,h),w,rand(20,90));tearFlash*=.65;}
 const whiteBase=p.white||0;
 if(whiteBase>0){let pulse=whiteBase;if(p.name==="whiteout")pulse=1.0;if(p.name==="outro"&&t<290)pulse=1-(t-287)/3;d.fillStyle=`rgba(255,252,236,${clamp(pulse,0,1)})`;d.fillRect(0,0,w,h);}
 if(barPulse && p.damage>.45 && Math.random()<.28){
   d.fillStyle=`rgba(255,248,226,${.05+p.damage*.08})`;
   d.fillRect(0,0,18,h);
   d.fillRect(w-18,0,18,h);
 }
 drawDirt(w,h,bass,highs,p);
 if(t>MUSICAL_END){
 const tailEnd=Math.max(MUSICAL_END+6,audio.duration||TRACK_SECONDS);
 const end=clamp((t-MUSICAL_END)/(tailEnd-MUSICAL_END),0,1);
 const white=clamp((t-MUSICAL_END)/1.6,0,1)*(1-clamp((t-MUSICAL_END)/3.4,0,1));
 d.fillStyle=`rgba(255,247,224,${white*.58})`;d.fillRect(0,0,w,h);
 s.fillStyle=`rgba(0,0,0,${Math.pow(end,.72)})`;s.fillRect(0,0,w,h);
 col.fillStyle=`rgba(0,0,0,${end*.72})`;col.fillRect(0,0,w,h);
}
}
async function start(){
 startBtn.disabled=true;loadStatus.textContent='Loading audio and first clip…';
 chooseRandomStart();
 if(!Object.keys(vids).length)makeVideos();
 if(!audioCtx)setupAudio();
 try{
  if(audioCtx.state==='suspended')await audioCtx.resume();
  const first=currentVid();
  activateVideo(first);
  await audio.play();
  isPlaying=true;starter.style.display='none';btnPlay.textContent='⏸';
  activeDrawVid=first&&first.readyState>=2?first:activeDrawVid;
  warmUpcomingVideos();
  if(!nextChange){const p=paramsAt(audio.currentTime);nextChange=audio.currentTime+rand(p.cutMin,p.cutMax);}
 }catch(e){
  console.error('Playback failed',e);
  loadStatus.textContent='Playback could not start. Tap to try again.';
  startBtn.disabled=false;
 }
}
startBtn.onclick=start;starter.onclick=e=>e.target===starter&&start();
wrap.addEventListener('pointerup',e=>{
 if(e.target.closest('.ui')||e.target.closest('#starter'))return;
 wrap.classList.add('ui-open');clearTimeout(uiTimer);
 uiTimer=setTimeout(()=>wrap.classList.remove('ui-open'),3500);
});
btnPlay.onclick=async()=>{if(audio.paused)await start();else{audio.pause();Object.values(vids).forEach(v=>v.pause());isPlaying=false;btnPlay.textContent='▶';}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){Object.values(vids).forEach(v=>v.pause());}else if(isPlaying&&!audio.paused){activateVideo(currentVid());}});
audio.addEventListener('ended',()=>{isPlaying=false;btnPlay.textContent='▶';});
audio.addEventListener('loadedmetadata',()=>{tDur.textContent=fmt(audio.duration||TRACK_SECONDS);});
audio.addEventListener('waiting',()=>{if(starter.style.display!=='none')loadStatus.textContent='Buffering audio…';});
audio.addEventListener('playing',()=>{loadStatus.textContent='';});
audio.ontimeupdate=()=>{const dur=audio.duration||TRACK_SECONDS;tTime.textContent=fmt(audio.currentTime);tDur.textContent=fmt(dur);if(dur)rSeek.value=audio.currentTime/dur;};
rSeek.oninput=e=>{const dur=audio.duration||TRACK_SECONDS;if(dur)audio.currentTime=Number(e.target.value)*dur;};
rVol.oninput=e=>{const v=Number(e.target.value);audio.volume=v;if(gain)gain.gain.value=v;};
render();
</script>
