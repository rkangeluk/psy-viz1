<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novalis</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#020405;color:#d8dcda;font:12px/1.4 Arial,sans-serif}#wrap{position:relative;width:100%;height:100vh;background:#020405;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}#scene{z-index:1}#fx{z-index:2;pointer-events:none}#veil{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,5,7,.55) 100%);box-shadow:inset 0 0 100px rgba(0,0,0,.65)}
.ui{position:absolute;z-index:10;left:0;right:0;bottom:0;display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;background:rgba(226,231,227,.88);color:#252a29;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}#wrap:hover .ui,#wrap.ui-open .ui{opacity:1;transform:none;pointer-events:auto}.btn{all:unset;cursor:pointer;width:36px;height:36px;text-align:center;border-radius:50%;background:rgba(0,0,0,.06)}.label{min-width:48px;text-align:right}.grow{flex:1}input[type=range]{appearance:none;height:4px;background:rgba(0,0,0,.2);border-radius:10px}input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#303735}
#starter{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#05090a}.title{font:300 clamp(28px,4vw,48px)/1 Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:#e5e8e5}.start{all:unset;cursor:pointer;width:120px;height:46px;border:1px solid rgba(225,232,228,.45);border-radius:999px;text-align:center;letter-spacing:.16em;color:#e5e8e5;background:rgba(255,255,255,.025)}#status{min-height:18px;opacity:.65}.hiddenVideo{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head><body><div id="wrap">
<canvas id="scene"></canvas><canvas id="fx"></canvas><div id="veil"></div>
<div class="ui"><button id="play" class="btn">▶</button><span id="time" class="label">0:00</span><input id="seek" class="grow" type="range" min="0" max="1" step=".001" value="0"><span id="dur" class="label">5:08</span><input id="vol" type="range" min="0" max="1" step=".01" value=".9" style="width:100px"></div>
<div id="starter"><div class="title"></div><button id="start" class="start">ENTER</button><div id="status"></div></div>
<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
</div><script>
const CONFIG={title:'Novalis',bpm:130,bars:167,audio:'novalis.mp3',visualEnd:308,videoBase:'https://pub-72e9e2f20fd24867ab095d7021d419db.r2.dev/novalis/'};
const CLIPS=['corridor','empty_classroom','escalator','factory','isolation','landline','stare','traffic_lights','vigil'];
const GROUPS={space:['corridor','empty_classroom','escalator'],system:['factory','landline','traffic_lights'],human:['isolation','vigil'],stare:['stare']};
const BPM=CONFIG.bpm,SPB=60/BPM,BAR=SPB*4,atBar=b=>(b-1)*BAR;
const BREAK_START=atBar(93),BREAK_END=atBar(113),FINAL_START=atBar(161);
const wrap=document.querySelector('#wrap'),canvas=document.querySelector('#scene'),fxCanvas=document.querySelector('#fx'),ctx=canvas.getContext('2d',{alpha:false}),fx=fxCanvas.getContext('2d');
const audio=document.querySelector('#audio'),starter=document.querySelector('#starter'),startBtn=document.querySelector('#start'),statusEl=document.querySelector('#status'),playBtn=document.querySelector('#play'),seek=document.querySelector('#seek'),vol=document.querySelector('#vol'),timeEl=document.querySelector('#time'),durEl=document.querySelector('#dur');
document.title=CONFIG.title+' — Visualizer';document.querySelector('.title').textContent=CONFIG.title;audio.src=CONFIG.audio;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let W=0,H=0,DPR=1,vids={},active=null,secondary=null,playing=false,audioCtx,analyser,source,gain,freq,timeData,lastBeat=-1,lastBar=-1,lastRender=0;
let nextCut=0,cutToken=0,baselineX=0,baselineY=0,baseZoom=1.015,contrast=1.12,saturation=.42,cold=.12;
let pulse={amp:0,voice:'A'},temporal=null,persist=null,falseCut=null,regionFault=null,freezeFrame=null,frameCache=document.createElement('canvas'),cacheCtx=frameCache.getContext('2d');
let nextMicro=18,nextFalsePulse=72,quality=1,fpsCount=0,fpsT=performance.now();
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;for(const c of [canvas,fxCanvas]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(DPR,0,0,DPR,0,0)}frameCache.width=Math.round(W*DPR);frameCache.height=Math.round(H*DPR);cacheCtx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function makeVideos(){for(const name of CLIPS){let v=document.createElement('video');v.className='hiddenVideo';v.src=CONFIG.videoBase+name+'.mp4';v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.crossOrigin='anonymous';document.body.appendChild(v);vids[name]=v}}
function ready(v){return new Promise(r=>{if(v.readyState>=2)return r();let done=()=>{v.removeEventListener('canplay',done);r()};v.addEventListener('canplay',done);setTimeout(done,5000)})}
async function activate(name,seekRandom=true){const token=++cutToken,v=vids[name];await ready(v);if(token!==cutToken)return;try{if(seekRandom&&isFinite(v.duration)&&v.duration>5)v.currentTime=rand(1,Math.max(1,v.duration-3));v.playbackRate=rand(.88,1.03);await v.play()}catch(e){}if(token!==cutToken)return;secondary=active;active=v;for(const [n,o] of Object.entries(vids))if(o!==active&&o!==secondary)o.pause()}
function phase(t){if(t<atBar(33))return 0;if(t<atBar(49))return 1;if(t<atBar(65))return 2;if(t<atBar(81))return 3;if(t<BREAK_START)return 4;if(t<BREAK_END)return 5;if(t<atBar(129))return 6;if(t<atBar(145))return 7;if(t<FINAL_START)return 8;return 9}
function poolFor(t){let p=phase(t);if(p<=1)return [...GROUPS.space,...GROUPS.system.slice(0,1)];if(p<=3)return [...GROUPS.space,...GROUPS.system];if(p===4)return [...GROUPS.space,...GROUPS.system,...GROUPS.human];if(p===5)return ['empty_classroom','landline','traffic_lights'];if(p===6)return [...GROUPS.system,...GROUPS.space,'isolation'];if(p===7)return [...GROUPS.space,...GROUPS.system,...GROUPS.human];if(p===8)return [...CLIPS];return ['stare','corridor','traffic_lights','isolation']}
function chooseClip(t){let pool=poolFor(t),name=pool[(Math.random()*pool.length)|0];if(active&&vids[name]===active&&pool.length>1)name=pool[(pool.indexOf(name)+1+(Math.random()*(pool.length-1)|0))%pool.length];return name}
function cutInterval(t){if(t>=BREAK_START&&t<BREAK_END)return rand(12,20);let p=phase(t);return [8,7,6,5,4.5,15,4.8,4.2,3.6,5][p]+rand(-1,1)}
function cover(v,c,x=0,y=0,zoom=1){if(!v||v.readyState<2)return;let vw=v.videoWidth||16,vh=v.videoHeight||9,sc=Math.max(W/vw,H/vh)*zoom,dw=vw*sc,dh=vh*sc;c.drawImage(v,(W-dw)/2+x,(H-dh)/2+y,dw,dh)}
function capture(){cacheCtx.save();cacheCtx.setTransform(DPR,0,0,DPR,0,0);cacheCtx.clearRect(0,0,W,H);cover(active,cacheCtx,baselineX,baselineY,baseZoom);cacheCtx.restore()}
function voiceForBeat(t,b){if(t>=BREAK_START&&t<BREAK_END)return 'LOFI';let r=Math.random();if(r<.72)return'A';if(r<.80)return'B';if(r<.87)return'C';if(r<.93)return'D';if(r<.975)return'E';return'EMPTY'}
function onBeat(t,b){pulse.voice=voiceForBeat(t,b);pulse.amp=pulse.voice==='EMPTY'?0:1;if(b%4===0){lastBar=Math.floor(b/4);if(t>20&&Math.random()<.045&&t<BREAK_START){baselineX+=rand(-2.5,2.5);baselineY+=rand(-1.5,1.5);baseZoom=clamp(baseZoom+rand(0,.0015),1.015,1.045)}}if(t>=FINAL_START){pulse.voice='C';}}
function scheduleMicro(t){let p=phase(t),intensity=p===0?.25:p===5?.12:clamp(.35+p*.08,.35,.9);nextMicro=t+rand(7,15)/intensity}
function triggerMicro(t){let p=phase(t);if(p===0&&Math.random()<.5){scheduleMicro(t);return}let options=p===5?['dup','crop','hold']:['dup','skip','register','region','persist','falsecut'];let kind=options[(Math.random()*options.length)|0];
 if(kind==='dup'&&active){let back=rand(.12,.34);try{active.currentTime=Math.max(.1,active.currentTime-back)}catch(e){}}
 if(kind==='skip'&&active){try{active.currentTime=Math.min(active.duration-.2,active.currentTime+rand(.12,.32))}catch(e){}}
 if(kind==='register'){baselineX+=rand(-6,6);baselineY+=rand(-3,3);if(Math.random()<.65)setTimeout(()=>{baselineX*=.55;baselineY*=.55},rand(120,500))}
 if(kind==='region'){capture();regionFault={until:t+rand(.18,.55),x:rand(.08,.65)*W,w:rand(.12,.28)*W,offset:rand(-9,9)}}
 if(kind==='persist'){capture();persist={until:t+rand(.18,.55),x:rand(0,.72)*W,y:rand(0,.7)*H,w:rand(.12,.3)*W,h:rand(.12,.3)*H}}
 if(kind==='falsecut'&&secondary){falseCut={until:t+rand(.08,.45),v:secondary}}
 if(kind==='crop')baseZoom=clamp(baseZoom+.005,1.015,1.05);
 if(kind==='hold'){capture();freezeFrame={until:t+SPB};}
 scheduleMicro(t)}
function gradeFor(t){let p=phase(t);let c=1.10+p*.018,s=.44-p*.018,br=.90;if(t>=BREAK_START&&t<BREAK_END){c=.92;s=.30;br=.84}if(t>=FINAL_START){let q=clamp((t-FINAL_START)/(CONFIG.visualEnd-FINAL_START),0,1);s*=1-q*.9;c+=q*.2;br-=q*.12}return{c,s,br}}
function draw(t){let g=gradeFor(t),decay=pulse.voice==='LOFI'?.78:.62;pulse.amp*=decay;let pa=pulse.amp,zoom=baseZoom,x=baselineX,y=baselineY,bright=g.br,cont=g.c,sat=g.s;
 switch(pulse.voice){case'A':zoom+=pa*.004;bright-=pa*.025;break;case'B':zoom+=pa*.002;cont-=pa*.14;bright+=pa*.02;break;case'C':zoom+=pa*.006;x+=pa*2;break;case'D':zoom+=pa*.003;break;case'E':x+=pa*4;y-=pa*1.5;break;case'LOFI':zoom+=pa*.002;cont-=pa*.08;bright+=pa*.015;break}
 ctx.save();ctx.clearRect(0,0,W,H);ctx.fillStyle='#020506';ctx.fillRect(0,0,W,H);ctx.filter=`brightness(${bright}) contrast(${cont}) saturate(${sat}) sepia(.08) hue-rotate(145deg)`;cover(active,ctx,x,y,zoom);ctx.filter='none';
 if(pulse.voice==='D'&&pa>.08){ctx.globalAlpha=.07*pa;cover(active,ctx,x-5,y,zoom*1.002);ctx.globalAlpha=1}
 if(falseCut&&t<falseCut.until){ctx.globalAlpha=.96;cover(falseCut.v,ctx,x,y,zoom);ctx.globalAlpha=1}else if(falseCut)falseCut=null;
 if(freezeFrame&&t<freezeFrame.until){ctx.globalAlpha=.98;ctx.drawImage(frameCache,0,0,frameCache.width,frameCache.height,0,0,W,H);ctx.globalAlpha=1}else if(freezeFrame)freezeFrame=null;
 if(regionFault&&t<regionFault.until){let r=regionFault;ctx.drawImage(frameCache,r.x*DPR,0,r.w*DPR,H*DPR,r.x+r.offset,0,r.w,H)}else if(regionFault)regionFault=null;
 if(persist&&t<persist.until){let q=persist;ctx.globalAlpha=.9;ctx.drawImage(frameCache,q.x*DPR,q.y*DPR,q.w*DPR,q.h*DPR,q.x,q.y,q.w,q.h);ctx.globalAlpha=1}else if(persist)persist=null;
 ctx.restore();
 fx.clearRect(0,0,W,H);let slow=clamp((t/CONFIG.visualEnd),0,1);fx.fillStyle=`rgba(2,13,16,${.035+slow*.045})`;fx.fillRect(0,0,W,H);
 if(t>=FINAL_START){let q=clamp((t-FINAL_START)/(CONFIG.visualEnd-FINAL_START),0,1);fx.fillStyle=`rgba(0,0,0,${q*q*.88})`;fx.fillRect(0,0,W,H)}
}
function render(now){requestAnimationFrame(render);if(!playing)return;let target=1000/(quality<.72?30:45);if(now-lastRender<target)return;lastRender=now;let t=audio.currentTime,b=Math.floor(t/SPB);if(b!==lastBeat){lastBeat=b;onBeat(t,b)}if(t>=nextMicro)triggerMicro(t);
 // three deliberately rare false visual kicks
 if(t>=nextFalsePulse&&t<BREAK_START){pulse.voice='A';pulse.amp=.8;nextFalsePulse+=rand(55,75)}
 if(t>=nextCut){activate(chooseClip(t));nextCut=t+cutInterval(t)}
 draw(t);seek.value=(audio.duration?audio.currentTime/audio.duration:0);timeEl.textContent=fmt(t);fpsCount++;if(now-fpsT>2500){let fps=fpsCount*1000/(now-fpsT);quality=fps<31?.62:fps<40?.8:1;fpsCount=0;fpsT=now}
}
function resetState(){let t=audio.currentTime;lastBeat=Math.floor(t/SPB)-1;nextCut=t+.1;nextMicro=t+rand(5,10);pulse.amp=0;temporal=persist=falseCut=regionFault=freezeFrame=null}
async function initAudio(){if(audioCtx)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();source=audioCtx.createMediaElementSource(audio);gain=audioCtx.createGain();analyser=audioCtx.createAnalyser();analyser.fftSize=512;source.connect(gain);gain.connect(analyser);analyser.connect(audioCtx.destination);gain.gain.value=Number(vol.value)}
async function start(){startBtn.disabled=true;statusEl.textContent='loading';await initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();let first='corridor';await activate(first);try{await audio.play();playing=true;starter.style.display='none';playBtn.textContent='❚❚';nextCut=audio.currentTime+7;scheduleMicro(audio.currentTime);requestAnimationFrame(render)}catch(e){statusEl.textContent='tap again to start';startBtn.disabled=false}}
startBtn.onclick=start;playBtn.onclick=async()=>{if(audio.paused){await initAudio();await audio.play();playing=true;playBtn.textContent='❚❚'}else{audio.pause();playing=false;playBtn.textContent='▶'}};seek.oninput=()=>{if(audio.duration){audio.currentTime=Number(seek.value)*audio.duration;resetState()}};vol.oninput=()=>{if(gain)gain.gain.value=Number(vol.value)};audio.onloadedmetadata=()=>{durEl.textContent=fmt(audio.duration||CONFIG.visualEnd)};audio.onended=()=>{playing=false;playBtn.textContent='▶'};
makeVideos();requestAnimationFrame(render);
</script></body></html>
